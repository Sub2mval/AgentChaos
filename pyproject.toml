[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchaos"
version = "0.1.0"
description = "Drop-in chaos engineering for LLM agent loops."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
requests = ["requests>=2.28"]
httpx = ["httpx>=0.24"]

[tool.setuptools.packages.find]
include = ["agentchaos*"]
