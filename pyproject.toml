[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchaos"
version = "0.1.0"
description = "Drop-in chaos engineering for LLM agent loops."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Mohit Valsangkar", email = "mvalsangkar@gmail.com" }]
dependencies = ["rich>=13.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/<you>/agentchaos"
Repository = "https://github.com/Sub2mval/AgentChaos"
Issues = "https://github.com/Sub2mval/AgentChaos/issues"

[project.optional-dependencies]
requests = ["requests>=2.28"]
httpx = ["httpx>=0.24"]

[tool.setuptools.packages.find]
include = ["agentchaos*"]
